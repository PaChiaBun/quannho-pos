name: Printer Setup Windows Builder

on:
  workflow_dispatch:

jobs:
  build-printer-setup:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/printer_setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Windows App (Release)
        run: flutter build windows --release

      - name: Zip release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../../release-builds | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../../release-builds/QuanNhoCaiMayIn-win-x64.zip -Force
          Get-Item ../../release-builds/QuanNhoCaiMayIn-win-x64.zip | Select-Object Name,Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinterSetup-Windows
          path: release-builds/QuanNhoCaiMayIn-win-x64.zip
