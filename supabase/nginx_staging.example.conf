# ═══════════════════════════════════════════════════════════════════════════
# NGINX REVERSE PROXY CONFIGURATION FOR STAGING
# File: supabase/nginx_staging.example.conf
# Target Domains:
#   - API Domain: quannho-staging.lpm.vn -> Proxy ROOT / to Kong Port 8010 (with WebSockets)
#   - Studio Domain: quannho-staging-db.lpm.vn -> Proxy / to Studio Port 3013 (with Auth Protection)
# Note: Replace <VPS_PUBLIC_IP> with actual VPS IP address.
# ═══════════════════════════════════════════════════════════════════════════

# ---------------------------------------------------------------------------
# SSL CERTIFICATE BOOTSTRAP INSTRUCTIONS (Run BEFORE enabling SSL blocks):
# 1. sudo certbot certonly --webroot -w /var/www/html -d quannho-staging.lpm.vn
# 2. sudo certbot certonly --webroot -w /var/www/html -d quannho-staging-db.lpm.vn
# 3. Create htpasswd file: sudo htpasswd -c /etc/nginx/.htpasswd_staging admin
# 4. Test configuration: sudo nginx -t
# 5. Reload Nginx: sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# 1. Staging API Dedicated Domain Block (Proxy ROOT / to Kong 8010)
server {
    listen 80;
    server_name quannho-staging.lpm.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name quannho-staging.lpm.vn;

    ssl_certificate     /etc/letsencrypt/live/quannho-staging.lpm.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quannho-staging.lpm.vn/privkey.pem;

    client_max_body_size 50M;

    # Proxy ROOT / directly to Staging Kong Gateway (Port 8010)
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Supabase Realtime
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings for long-lived WebSockets & Server-Sent Events
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

# 2. Staging Studio Dedicated Server Block (Protected by HTTP Basic Auth & Optional IP Allowlist)
server {
    listen 80;
    server_name quannho-staging-db.lpm.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name quannho-staging-db.lpm.vn;

    ssl_certificate     /etc/letsencrypt/live/quannho-staging-db.lpm.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quannho-staging-db.lpm.vn/privkey.pem;

    client_max_body_size 50M;

    # Protection Method 1: HTTP Basic Auth (Recommended baseline)
    auth_basic "Restricted Staging Studio";
    auth_basic_user_file /etc/nginx/.htpasswd_staging;

    # Protection Method 2: Optional IP Allowlist (Uncomment if fixed IP available)
    # allow <DEVELOPER_IP_ADDRESS>;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
