name: quannho_pos
description: "Quán Nhỏ POS - Quản lý cửa hàng đơn giản"
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.6
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_riverpod: ^3.3.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  http: ^1.2.2
  supabase_flutter: ^2.8.4
  audioplayers: ^6.1.0
  crypto: ^3.0.6
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  googleapis: ^13.2.0
  googleapis_auth: ^2.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.13.1
  drift_dev: ^2.32.1
  mocktail: ^1.0.4
  msix: ^3.17.0

flutter_native_splash:
  color: "#1C2151"
  image: assets/branding/logo_head.png
  color_dark: "#1C2151"
  image_dark: assets/branding/logo_head.png
  android_12:
    image: assets/branding/logo_head.png
    color: "#1C2151"
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1C2151"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/
    - assets/lottie/
    - assets/i18n/
    - assets/branding/

msix_config:
  display_name: "Quán Nhỏ POS"
  publisher_display_name: "Quán Nhỏ"
  identity_name: "com.quannho.pos"
  publisher: "CN=Quán Nhỏ, O=Quán Nhỏ, L=Ho Chi Minh, C=VN"
  logo_path: "assets/branding/app_icon.png"
  capabilities: "internetClient"
  architecture: "x64"
  install_certificate: false
